server:
  port: ${SERVER_PORT:8080}

auth0:
  domain: ${AUTH0_DOMAIN:}
  audience: ${AUTH0_AUDIENCE:}
cors:
  origins: ${CORS_ORIGINS:http://localhost:5173}

spring:
  application:
    name: transactions-api
  # Em dev, lê as variáveis do .env da raiz do projeto (opcional; em produção vêm do ambiente).
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:transactions;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: false

credit-score:
  base-url: ${CREDIT_SCORE_API_URL:http://localhost:8082}
  timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
