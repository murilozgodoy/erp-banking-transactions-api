server:
  port: ${SERVER_PORT:8080}

auth0:
  domain: ${AUTH0_DOMAIN:}
  audience: ${AUTH0_AUDIENCE:}
cors:
  origins: ${CORS_ORIGINS:http://localhost:5173}

spring:
  application:
    name: transactions-api
  # Em dev, lê as variáveis do .env da raiz do projeto (opcional; em produção vêm do ambiente).
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:transactions;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    # Em produção (compose): DATABASE_URL=jdbc:postgresql://postgres:5432/erp?currentSchema=transactions
    # e DATABASE_DRIVER=org.postgresql.Driver; as tabelas são criadas/atualizadas no startup.
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: false
  rabbitmq:
    # Ex.: amqp://erp:erp@rabbitmq:5672/ — vazio desliga a mensageria (no-op).
    addresses: ${RABBITMQ_URL:}
    connection-timeout: 2s
    listener:
      simple:
        # Erro ao processar (ex.: banco fora): 3 tentativas com backoff (1s, 2s) e depois descarta,
        # em vez de requeue infinito em loop quente. Payload inválido é descartado na hora.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

# MESSAGING_ENABLED=true|false força ligar/desligar; vazio = ligado se RABBITMQ_URL estiver definida.
messaging:
  enabled: ${MESSAGING_ENABLED:}
  exchange: erp.events
  # Consome customer.created (fila transactions.customer-created) e abre conta corrente com saldo zero.
  auto-open-account: ${AUTO_OPEN_ACCOUNT:false}

credit-score:
  base-url: ${CREDIT_SCORE_API_URL:http://localhost:8082}
  timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Broker fora do ar não derruba o healthcheck: publicar é best effort.
    rabbit:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Swagger UI com URLs relativas à página (/swagger-ui/index.html): funcionam direto, pelo gateway e pela Vercel.
springdoc:
  swagger-ui:
    config-url: ../v3/api-docs/swagger-config
    url: ../v3/api-docs
