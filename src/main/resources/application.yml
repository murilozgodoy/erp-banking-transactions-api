server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: transactions-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:transactions;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: false

credit-score:
  base-url: ${CREDIT_SCORE_API_URL:http://localhost:8002}
  timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
